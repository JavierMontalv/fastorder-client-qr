name: Deploy QR menu to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: comanda-menu-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  S3_BUCKET: comanda-menu-web-prod-061039768875
  CLOUDFRONT_DISTRIBUTION_ID: E1THVYGIXF2J3N
  CLOUDFRONT_DOMAIN: menu.somoscomanda.com
  VITE_API_URL: https://api.somoscomanda.com/api
  VITE_ASSETS_URL: https://api.somoscomanda.com
  VITE_SOCKET_URL: https://api.somoscomanda.com

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build static application
        run: npm run build

      - name: Verify build artifact
        run: test -s dist/index.html

      - name: Authenticate to AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::061039768875:role/ComandaMenuGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish files with safe cache headers
        run: |
          aws s3 sync dist "s3://${S3_BUCKET}" --delete --exclude "assets/*" --cache-control "public,max-age=0,must-revalidate"
          aws s3 sync dist/assets "s3://${S3_BUCKET}/assets" --delete --cache-control "public,max-age=31536000,immutable"

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID="$(aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths '/*' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --id "${INVALIDATION_ID}"

      - name: Verify temporary CloudFront production origin
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 "https://${CLOUDFRONT_DOMAIN}/"
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 "https://${CLOUDFRONT_DOMAIN}/menu/aws-smoke-test"
          curl --fail --retry 4 --retry-all-errors --retry-delay 5 \
            -X OPTIONS "https://api.somoscomanda.com/api/auth/login" \
            -H "Origin: https://menu.somoscomanda.com" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,authorization"
